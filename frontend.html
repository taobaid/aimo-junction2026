<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valio Aimo Purchasing Agent</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    p.subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .stage {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orb {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      z-index: 2;
    }
    .orb.speaking {
      transform: scale(1.15);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.9);
      background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a);
    }
    .orb.thinking {
      animation: pulse 1s infinite alternate;
      background: radial-gradient(circle at 30% 30%, #facc15, #ca8a04);
      box-shadow: 0 0 45px rgba(250, 204, 21, 0.8);
    }
    .food-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: spin 18s linear infinite;
    }
    .food-ring.fast {
      animation: spin 3s linear infinite;
    }
    .food-item {
      position: absolute;
      font-size: 2rem;
      user-select: none;
    }
    .f1 { top: 0; left: 50%; transform: translateX(-50%); }
    .f2 { bottom: 0; left: 50%; transform: translateX(-50%); }
    .f3 { left: 0; top: 50%; transform: translateY(-50%); }
    .f4 { right: 0; top: 50%; transform: translateY(-50%); }
    .f5 { top: 15%; left: 15%; }
    .f6 { bottom: 15%; right: 15%; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }
    .controls { margin-top: 2.5rem; display: flex; gap: 1rem; }
    button {
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
    }
    #startBtn { background: #38bdf8; color: #0f172a; }
    #stopBtn { background: #ef4444; color: white; display: none; }
    #status { margin-top: 1.2rem; font-size: 0.95rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <h1>Valio Aimo Voice Buyer</h1>
  <p class="subtitle">Speak your kitchen order, dietary needs, and delivery deadline</p>
  <div class="stage">
    <div class="food-ring" id="foodRing">
      <span class="food-item f1">🥛</span>
      <span class="food-item f2">🧀</span>
      <span class="food-item f3">🥦</span>
      <span class="food-item f4">🍞</span>
      <span class="food-item f5">🥩</span>
      <span class="food-item f6">🧈</span>
    </div>
    <div class="orb" id="orb">Ready</div>
  </div>
  <div class="controls">
    <button id="startBtn">Start Order Call</button>
    <button id="stopBtn">End Call</button>
  </div>
  <div id="status">Click "Start Order Call" to begin</div>
  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web";
    const PUBLIC_KEY = "7433c014-2d40-4183-8ddc-aacbe2eeb8db";
    const ASSISTANT_ID = "08565774-130d-45d4-a29b-b49494eb96c5";
    const vapi = new Vapi(PUBLIC_KEY);
    const orb = document.getElementById("orb");
    const foodRing = document.getElementById("foodRing");
    const statusText = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    startBtn.onclick = () => {
      statusText.innerText = "Connecting to Valio Aimo...";
      vapi.start(ASSISTANT_ID);
    };
    stopBtn.onclick = () => { vapi.stop(); };
    vapi.on("call-start", () => {
      startBtn.style.display = "none";
      stopBtn.style.display = "inline-block";
      orb.innerText = "Listening";
      statusText.innerText = "Connected — speak your kitchen request";
    });
    vapi.on("call-end", () => {
      startBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
      orb.className = "orb";
      orb.innerText = "Ready";
      foodRing.classList.remove("fast");
      statusText.innerText = "Call ended";
    });
    vapi.on("speech-start", () => {
      orb.className = "orb speaking";
      orb.innerText = "Speaking";
      foodRing.classList.remove("fast");
    });
    vapi.on("speech-end", () => {
      orb.className = "orb";
      orb.innerText = "Listening";
    });
    vapi.on("message", (msg) => {
      if (msg.type === "tool-calls") {
        orb.className = "orb thinking";
        orb.innerText = "Thinking...";
        foodRing.classList.add("fast");
        statusText.innerText = "Checking Valio Aimo catalog & stock...";
      }
      if (msg.type === "tool-calls-result") {
        orb.className = "orb";
        orb.innerText = "Listening";
        foodRing.classList.remove("fast");
        statusText.innerText = "Catalog check complete";
      }
    });
  </script>
</body>
</html>
